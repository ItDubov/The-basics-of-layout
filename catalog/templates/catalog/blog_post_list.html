{% extends "catalog/base.html" %}

{% block content %}
    <h1>Блог</h1>
    <ul>
        {% for post in blog_posts %}
            <li>
                <a href="{% url 'blog:blog_post_detail' post.pk %}">{{ post.title }}</a> - {{ post.created_at }}
            </li>
        {% endfor %}
    </ul>
{% endblock %}
