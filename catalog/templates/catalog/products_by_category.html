{% extends "catalog/base.html" %}
{% block content %}
  <div class="container mt-4">
    <h3>Продукты в категории</h3>
    <ul>
      {% for product in products %}
        <li><a href="{% url 'products:product_detail' product.pk %}">{{ product.name }}</a></li>
      {% empty %}
        <li>Нет продуктов</li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
