{% extends "catalog/base.html" %}

{% block content %}
<div class="container mt-5">
    <h1>{% if object %}Редактировать продукт: {{ object.name }}{% else %}Создать новый продукт{% endif %}</h1>

    <form method="post" enctype="multipart/form-data" class="card p-4 shadow-sm">
        {% csrf_token %}

        <!-- Отображаем форму -->
        {{ form.as_p }}  <!-- Это отобразит форму с полями: название, описание, цена, изображение, категория -->

        <div class="form-group">
            <button type="submit" class="btn btn-success">
                {% if object %}Сохранить изменения{% else %}Создать продукт{% endif %}
            </button>
            <a href="{% url 'products:product_list' %}" class="btn btn-outline-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
