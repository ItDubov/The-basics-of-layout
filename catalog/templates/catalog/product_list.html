{% extends "catalog/base.html" %}

{% block content %}
<div class="container mt-4">
    {% if user.is_authenticated %}
        <a href="{% url 'products:product_create' %}" class="btn btn-success mb-3">Добавить новый продукт</a>
    {% endif %}

    <div class="row">
        {% for product in products %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ product.name }}</h5>
                        <p class="card-text">{{ product.description|truncatewords:20 }}</p>
                        <a href="{% url 'products:product_edit' product.pk %}" class="btn btn-warning">Редактировать</a>
                        <a href="{% url 'products:product_delete' product.pk %}" class="btn btn-danger">Удалить</a>
                        <a href="{% url 'products:product_detail' product.pk %}" class="btn btn-primary">Подробнее</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
