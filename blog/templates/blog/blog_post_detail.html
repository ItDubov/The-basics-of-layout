{% extends "catalog/base.html" %}

{% block title %}{{ blog_post.title }}{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-3">{{ blog_post.title }}</h1>

    <div class="card p-4 shadow-sm">
        <p>{{ blog_post.content }}</p>
        <p class="text-muted">Просмотров: {{ blog_post.views_count }}</p>
    </div>

    <div class="mt-3">
        <a href="{% url 'blog:post_delete' blog_post.pk %}" class="btn btn-danger">Удалить запись</a>

        <a href="{% url 'blog:post_list' %}" class="btn btn-outline-primary">Назад к списку</a>
    </div>
</div>
{% endblock %}
