{% extends "catalog/base.html" %}

{% block title %}Удаление записи{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4 text-danger">Вы уверены, что хотите удалить запись?</h1>

    <div class="card p-4 shadow-sm">
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
